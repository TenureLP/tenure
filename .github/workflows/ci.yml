name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: build
        working-directory: lease-vault
        run: forge build --sizes
      - name: test
        working-directory: lease-vault
        run: forge test -vv
        env:
          FOUNDRY_FUZZ_RUNS: 5000

  services:
    name: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lp-api tests
        working-directory: lp-api
        run: python -m unittest discover -s tests
      - name: every module compiles
        run: python -m compileall -q lp-api/lpval landing/dev_server.py landing/server.py landing/read_waitlist.py app/server.py docs-site/server.py
      - name: landing and app servers refuse everything but their pages
        run: python check-servers.py

# The fork tests are deliberately absent: they need a live node, and a chain outage is not a reason
# to mark a commit broken. Run them with lease-vault/fork-test.sh before anything is deployed.
