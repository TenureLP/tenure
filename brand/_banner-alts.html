<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner options</title>
<!-- Each option shown the way X shows a header: cropped a little, profile picture punched in. -->
<style>
  * { box-sizing: border-box; margin: 0 }
  body { width: 1560px; background: #000; padding: 26px; color: #E7E9EA;
         font: 400 15px/1.4 Barlow, "Segoe UI", sans-serif }
  .row { margin-bottom: 30px }
  .tag { display: flex; align-items: baseline; gap: 14px; margin-bottom: 9px }
  .tag b { font-size: 25px; font-weight: 700 }
  .tag span { color: #71767B; font-size: 17px }
  .frame { position: relative; width: 1500px; height: 500px; overflow: hidden }
  .frame img.bn { width: 1500px; height: 500px; display: block }
  .av { position: absolute; left: 51px; top: 329px; width: 342px; height: 342px; border-radius: 50%; border: 10px solid #000; overflow: hidden }
  .av img { width: 100%; height: 100% }
  .cut { position: absolute; left: 0; width: 1500px; height: 25px; background: rgba(0,0,0,.55) }
  .cut.t { top: 0 } .cut.b { bottom: 0 }
  .pad { height: 38px }
</style>
</head>
<body>
  <div id="rows"></div>
  <script>
    var opts = [
      ["T1", "original chart untouched, phrase re-set at the same size"],
      ["T2", "phrase grown to 78px, chart slid right to make room — active"],
      ["T3", "T2 plus a small eyebrow above the phrase"]
    ];
    document.getElementById("rows").innerHTML = opts.map(function (o) {
      var k = o[0].toLowerCase();
      return '<div class="row"><div class="tag"><b>' + o[0] + '</b><span>' + o[1] + '</span></div>' +
        '<div class="frame"><img class="bn" src="banner-' + k + '.png">' +
        '<div class="cut t"></div><div class="cut b"></div>' +
        '<div class="av"><img src="logo-avatar-1024.png"></div></div><div class="pad"></div></div>';
    }).join("");
  </script>
</body>
</html>
