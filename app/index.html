<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenure · App</title>
<meta name="description" content="Value a Uniswap v4 position and offer it for sale-and-leaseback.">
<meta name="theme-color" content="#0E1726">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark-small.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-lo: #0A111D; --navy: #0E1726; --navy-hi: #1B2B48; --panel: #121D31; --panel-hi: #17243C;
    --ink: #F4F1EA; --muted: rgba(244,241,234,.66); --faint: rgba(244,241,234,.40);
    --line: rgba(244,241,234,.11); --line-hi: rgba(244,241,234,.22);
    --amber: #F5B84B; --amber-hi: #FFD683; --ok: #7BE0A6; --bad: #FF8B7B;
    --radius: 16px;
    --ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 0 16px 80px;
    background: radial-gradient(1100px 700px at 70% -10%, rgba(27,43,72,.6), transparent 70%), var(--navy-lo);
    color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  /* ---------------------------------------------------------------- nav */
  nav {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 22px 0 26px; border-bottom: 1px solid var(--line); margin-bottom: 34px;
  }
  .logo { display: flex; align-items: center; gap: 11px; font-weight: 600; font-size: 20px; letter-spacing: -.01em; }
  .logo img { width: 30px; height: 30px; }
  .spacer { flex: 1; }
  .net {
    font-family: var(--mono); font-size: 12px; color: var(--faint);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
  }
  .net.on { color: var(--ok); border-color: rgba(123,224,166,.35); }
  .net.off { color: var(--bad); border-color: rgba(255,139,123,.35); }

  /* ---------------------------------------------------------------- type */
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 10px; text-wrap: balance; }
  .lede { color: var(--muted); margin: 0 0 30px; max-width: 62ch; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
       color: var(--amber); margin: 0 0 14px; }

  /* ---------------------------------------------------------------- controls */
  .bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
  input[type="text"], input[type="number"] {
    flex: 1; min-width: 190px; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line-hi); border-radius: 12px; padding: 13px 16px;
    font-family: var(--mono); font-size: 15px;
  }
  input::placeholder { color: var(--faint); }
  input:focus { outline: none; border-color: var(--amber); }
  button {
    font-family: var(--ui); font-size: 15px; font-weight: 600; border-radius: 12px;
    padding: 13px 22px; cursor: pointer; border: 1px solid transparent;
    transition: background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .primary { background: var(--amber); color: #15213A; }
  .primary:hover { background: var(--amber-hi); }
  .ghost { background: var(--panel-hi); color: var(--ink); border-color: var(--line-hi); }
  .ghost:hover { border-color: var(--amber); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---------------------------------------------------------------- panels */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
           padding: 24px 26px; margin-bottom: 18px; }
  .note { color: var(--faint); font-size: 14px; }

  .rows { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line);
          border-radius: 12px; overflow: hidden; }
  .row { background: var(--panel); display: flex; justify-content: space-between; align-items: baseline;
         gap: 18px; padding: 13px 18px; }
  .row .k { color: var(--faint); font-size: 14px; }
  .row .v { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; text-align: right;
            word-break: break-all; }
  .row .v.am { color: var(--amber); font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line);
           border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 18px; }
  .tile { background: var(--panel); padding: 20px; }
  .tile .k { font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--faint); }
  .tile .v { font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin-top: 8px;
             font-variant-numeric: tabular-nums; }
  .tile.am .v { color: var(--amber); }
  .tile .u { font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .1em; margin-top: 4px; }

  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
          letter-spacing: .1em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; }
  .pill.ok { background: rgba(123,224,166,.12); color: var(--ok); }
  .pill.no { background: rgba(255,139,123,.12); color: var(--bad); }

  .msg { border-radius: 12px; padding: 14px 18px; font-size: 15px; margin-bottom: 18px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: rgba(255,139,123,.09); border-left: 3px solid var(--bad); color: var(--ink); }
  .msg.info { background: rgba(245,184,75,.08); border-left: 3px solid var(--amber); color: var(--ink); }

  .hidden { display: none !important; }

  footer { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line);
           color: var(--faint); font-size: 13px; }
  footer a { color: var(--muted); }

  @media (max-width: 620px) {
    h1 { font-size: 27px; }
    .tiles { grid-template-columns: 1fr; }
    .row { flex-direction: column; gap: 4px; }
    .row .v { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <span class="logo"><img src="assets/logo-mark-small.svg" alt=""> Tenure</span>
    <span class="spacer"></span>
    <span class="net" id="net">not connected</span>
    <button class="ghost" id="connect" type="button">Connect wallet</button>
  </nav>

  <h1>Value a position.</h1>
  <p class="lede">Paste the id of a Uniswap v4 position and see what it holds, what its range has
    actually earned, and the terms it could be offered on. Nothing is signed here.</p>

  <div class="msg" id="msg"></div>

  <div class="bar">
    <input type="text" id="tokenId" inputmode="numeric" placeholder="Position id, for example 2908273"
           autocomplete="off" spellcheck="false">
    <button class="primary" id="lookup" type="button">Value it</button>
  </div>

  <div id="result" class="hidden"></div>

  <footer>
    No contract is deployed yet, so nothing on this page can be listed or funded.
    <a href="https://github.com/TenureLP/tenure">Source</a>.
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
